{% extends "base.html" %}
{% block title %}Producer Register — Tulacraft{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-4"><i class="bi bi-shop"></i> Create Producer Account</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name / Shop Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Country</label>
                        <input type="text" name="country" class="form-control" placeholder="Serbia, Bosnia...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Your Language</label>
                        <select name="language" class="form-select">
                            <option value="en">English</option>
                            <option value="de">Deutsch</option>
                            <option value="fr">Français</option>
                            <option value="es">Español</option>
                            <option value="it">Italiano</option>
                            <option value="pt">Português</option>
                            <option value="ar">العربية (Arabic)</option>
                            <option value="ja">日本語 (Japanese)</option>
                            <option value="zh">中文 (Mandarin)</option>
                            <option value="ko">한국어 (Korean)</option>
                            <option value="hi">हिन्दी (Hindi)</option>
                            <option value="bn">বাংলা (Bengali)</option>
                            <option value="sw">Swahili</option>
                            <option value="tr">Türkçe</option>
                            <option value="sr">Srpski</option>
                            <option value="mk">Македонски</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('producer.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
