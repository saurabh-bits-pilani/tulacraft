{% extends "base.html" %}
{% block title %}Join Tulacraft{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="mb-1"><i class="bi bi-person-plus"></i> Create Buyer Account</h3>
            <p class="text-muted mb-4">Find handmade clothing in your size, in your language.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Country</label>
                        <input type="text" name="country" class="form-control" placeholder="Your country">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Preferred Language</label>
                        <select name="language" class="form-select">
                            {% for code, name in languages.items() %}
                            <option value="{{ code }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('buyer.login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
